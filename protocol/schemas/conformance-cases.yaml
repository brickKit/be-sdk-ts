# Conformance profiles and cases of the component protocol, version 1.0.
# The suite is conformance/component/ of brickKit/be-acceptance; this file is the catalogue it
# implements. Case IDs are stable and append-only. `level` MUST fails the run, SHOULD warns.
# `skippable: true` marks a case that may be skipped, with a reason in assembly.yaml
# conformance.skip, when the component does not use the feature it tests. `applies_when` marks a case that
# applies only when its condition holds; otherwise the case is reported as not applicable (neither skipped
# nor failed).
# Format: schemas/conformance-cases.schema.json.
protocol: "1.0"
profiles:
  - { name: core,        when: "always" }
  - { name: obs,         when: "always" }
  - { name: err,         when: "always" }
  - { name: auth,        when: "the component has any route that is not Public (an operation without x-be-permission counts, unless x-be-internal)" }
  - { name: scope,       when: "data_scopes is not none, or resources is declared" }
  - { name: grpc,        when: "an extra port is named grpc" }
  - { name: outbound,    when: "dependencies.components is not empty" }
  - { name: events-pub,  when: "component.yaml events.publishes is not empty (the subjects of the event contract)" }
  - { name: events-sub,  when: "component.yaml events.subscribes is not empty (the subjects of fixtures events.consumes)" }
  - { name: idempotency, when: "any write accepts idempotency_key or Idempotency-Key" }
  - { name: db,          when: "configSchema declares PG_SCHEMA or PG_HOST" }
  - { name: jobs,        when: "the component has a database" }
  - { name: lifecycle,   when: "the component has a database" }
  - { name: blob,        when: "configSchema declares S3_BUCKET or S3_URL" }
  - { name: shell,       when: "component.yaml has shell.members; each member's own profiles are re-run in shell mode" }
cases:
  # core
  - { id: CP-CORE-01, profile: core, level: MUST, tests: [P1.1, P11.1], title: "migration run twice in a row exits 0 both times" }
  - { id: CP-CORE-02, profile: core, level: MUST, tests: [P1.2, P2.2, P2.3], title: "missing or unparsable required key exits 78 and the log names the key" }
  - { id: CP-CORE-03, profile: core, level: MUST, tests: [P1.2, P12.13], title: "PostgreSQL, bus and authz ready after the component: it does not exit and recovers" }
  - { id: CP-CORE-04, profile: core, level: MUST, tests: [P1.3], title: "/healthz stays 200 with PostgreSQL stopped" }
  - { id: CP-CORE-05, profile: core, level: MUST, tests: [P1.4, P10.7], title: "/readyz is 503 NOT_READY with metadata.waiting until bundle, identity and migrations are in place, then 200; stopping PostgreSQL or authz afterwards leaves it 200" }
  - { id: CP-CORE-06, profile: core, level: MUST, tests: [P1.6, P1.12], title: "SIGTERM: exit 0 within SHUTDOWN_GRACE, before stopGracePeriodSeconds; in-flight requests finish (checked only when fixtures declare slow)" }
  - { id: CP-CORE-07, profile: core, level: MUST, tests: [P1.9], title: "the image has /bin/sh and wget" }
  - { id: CP-CORE-08, profile: core, level: MUST, tests: [P3.5], title: "slow request headers are disconnected" }
  - { id: CP-CORE-09, profile: core, level: MUST, tests: [P3.6], title: "a body above the limit answers 413 BODY_TOO_LARGE" }
  - { id: CP-CORE-10, profile: core, level: MUST, tests: [P3.2], title: "X-Request-Id echoed, generated when absent" }
  - { id: CP-CORE-11, profile: core, level: MUST, tests: [P3.1, P3.12, P20.2, P20.3, P20.4], title: "/_be/info matches the manifests and the container; its profiles equal the selected set exactly" }
  - { id: CP-CORE-12, profile: core, level: MUST, tests: [P1.11, P1.12, P7.14], title: "component.yaml declares healthCheck /healthz, readinessCheck /readyz, stopGracePeriodSeconds >= SHUTDOWN_GRACE + 5 s and the port protocols" }
  - { id: CP-CORE-13, profile: core, level: MUST, tests: [P1.13], title: "/healthz answers on 127.0.0.1 and on ::1 inside the container, and every declared port accepts IPv4 and IPv6" }
  - { id: CP-CORE-14, profile: core, level: MUST, tests: [P2.7, P2.12], title: "every secret key is mount: file and named _FILE; no secret value appears in the container's environment" }
  # obs
  - { id: CP-OBS-01, profile: obs, level: MUST, tests: [P3.3, P18.1], title: "an inbound traceparent becomes the parent of the server span seen by the OTLP sink" }
  - { id: CP-OBS-02, profile: obs, level: MUST, tests: [P3.10, P4.6, P18.2, P18.4], title: "log fields complete; access log carries trace_id; error levels by code" }
  - { id: CP-OBS-03, profile: obs, level: MUST, tests: [P3.12, P14.3, P18.3], title: "/metrics names, component label, route templates" }
  - { id: CP-OBS-04, profile: obs, level: MUST, tests: [P2.7, P18.2], title: "personal-data and secret keys are redacted in logs" }
  - { id: CP-OBS-05, profile: obs, level: MUST, tests: [P18.2], title: "LOG_LEVEL=warn writes no info lines" }
  # err
  - { id: CP-ERR-01, profile: err, level: MUST, tests: [P4.1, P4.5, P4.8], title: "every 4xx/5xx is problem+json; reason is catalogued" }
  - { id: CP-ERR-02, profile: err, level: MUST, tests: [P4.2], applies_when: "the component has a grpc port", title: "gRPC errors carry ErrorInfo and map to and from REST (operations paired by fixtures paired_with)" }
  - { id: CP-ERR-03, profile: err, level: MUST, tests: [P4.3], applies_when: "the component has a database", title: "a revoked table grant answers 500 with only generic text and trace_id; no SQL text" }
  - { id: CP-ERR-04, profile: err, level: MUST, tests: [P4.4, P4.7], title: "every reason seen during the run is catalogued" }
  # auth
  - { id: CP-AUTH-01, profile: auth, level: MUST, tests: [P5.1], title: "no token answers 401 TOKEN_INVALID" }
  - { id: CP-AUTH-02, profile: auth, level: MUST, tests: [P5.2], title: "alg none, HS256, missing kid answer 401" }
  - { id: CP-AUTH-03, profile: auth, level: MUST, tests: [P5.3, P5.9], title: "a refresh token answers 401" }
  - { id: CP-AUTH-04, profile: auth, level: MUST, tests: [P5.3], title: "wrong iss answers 401" }
  - { id: CP-AUTH-05, profile: auth, level: MUST, tests: [P5.3], title: "wrong aud answers 401" }
  - { id: CP-AUTH-06, profile: auth, level: MUST, tests: [P5.3], title: "missing exp answers 401" }
  - { id: CP-AUTH-07, profile: auth, level: MUST, tests: [P5.4], title: "JWKS rotation; an unknown kid triggers a refetch" }
  - { id: CP-AUTH-08, profile: auth, level: MUST, tests: [P5.6], title: "a stale token answers 401 token_stale" }
  - { id: CP-AUTH-09, profile: auth, level: MUST, tests: [P6.2, P3.16], title: "every OpenAPI operation has a guard (x-be-permission, or x-be-internal); without a token every non-Public one answers 401" }
  - { id: CP-AUTH-10, profile: auth, level: MUST, tests: [P1.5, P6.2], title: "before the first bundle, every non-Public route answers 401 TOKEN_INVALID without a valid token, otherwise 503 AUTHZ_NOT_READY" }
  - { id: CP-AUTH-11, profile: auth, level: MUST, tests: [P6.2], title: "a missing key answers 403 MISSING_PERMISSION with metadata.permission" }
  - { id: CP-AUTH-12, profile: auth, level: MUST, tests: [P5.5, P6.2], title: "act.kind=agent with agents=false answers 401 UNSUPPORTED_DELEGATION; a stale delegated token answers TOKEN_STALE first" }
  - { id: CP-AUTH-13, profile: auth, level: MUST, tests: [P6.1], title: "authz stopped after the first bundle: decisions continue (fail-static)" }
  # scope
  - { id: CP-SCOPE-01, profile: scope, level: MUST, tests: [P6.3, P6.5], title: "own / dept / subtree / all matrix" }
  - { id: CP-SCOPE-02, profile: scope, level: MUST, tests: [P6.3], title: "levels evaluated per key" }
  - { id: CP-SCOPE-03, profile: scope, level: MUST, tests: [P6.3], title: "dimension values and *" }
  - { id: CP-SCOPE-04, profile: scope, level: MUST, tests: [P6.3], title: "until expiry" }
  - { id: CP-SCOPE-05, profile: scope, level: MUST, tests: [P6.3], title: "several roles: the highest level wins" }
  - { id: CP-SCOPE-06, profile: scope, level: MUST, tests: [P6.4], title: "no department sees only own rows (R60)" }
  - { id: CP-SCOPE-07, profile: scope, level: MUST, tests: [P6.6, P3.15], title: "an invisible record answers 404 to a read" }
  - { id: CP-SCOPE-08, profile: scope, level: MUST, tests: [P6.6, P3.15], title: "a command on an invisible record answers 404" }
  - { id: CP-SCOPE-09, profile: scope, level: MUST, tests: [P6.6], title: "visible but not allowed answers 403; an out-of-scope dimension parameter answers 403 OUT_OF_SCOPE" }
  - { id: CP-SCOPE-10, profile: scope, level: MUST, tests: [P6.5, P6.7], title: "List/Can consistency under random grants (property test)" }
  - { id: CP-SCOPE-11, profile: scope, level: MUST, skippable: true, tests: [P6.8], title: "field masking; sorting by a masked field refused" }
  - { id: CP-SCOPE-12, profile: scope, level: MUST, tests: [P6.10], title: "_authz/check shape and its 500-item limit" }
  - { id: CP-SCOPE-13, profile: scope, level: MUST, tests: [P6.10], title: "explain does not leak an invisible record" }
  - { id: CP-SCOPE-14, profile: scope, level: MUST, tests: [P6.10], title: "sharing=false: _shares answers 501 CAPABILITY_UNAVAILABLE" }
  - { id: CP-SCOPE-15, profile: scope, level: MUST, skippable: true, tests: [P6.11, P6.12], title: "a share from the changefeed visible within 6 s, at once with X-Authz-Revision, gone after revoke" }
  # grpc
  - { id: CP-RPC-01, profile: grpc, level: MUST, tests: [P7.2], title: "no be-caller answers UNAUTHENTICATED MISSING_CALLER" }
  - { id: CP-RPC-02, profile: grpc, level: MUST, tests: [P7.2, P7.4], title: "system-call logs carry caller" }
  - { id: CP-RPC-03, profile: grpc, level: MUST, tests: [P7.3], title: "a user-facing rpc over gRPC answers UNAUTHENTICATED / TOKEN_INVALID" }
  - { id: CP-RPC-04, profile: grpc, level: MUST, tests: [P7.5], title: "a 5 MiB request is refused" }
  - { id: CP-RPC-05, profile: grpc, level: MUST, tests: [P7.5], title: "GOAWAY after MaxConnectionAge; the client reconnects transparently" }
  - { id: CP-RPC-06, profile: grpc, level: MUST, skippable: true, tests: [P7.10], title: "BatchGet above its limit answers BATCH_TOO_LARGE with BadRequest" }
  # outbound
  - { id: CP-OUT-01, profile: outbound, level: MUST, tests: [P7.6], title: "50 triggers: the fake peer sees one connection" }
  - { id: CP-OUT-02, profile: outbound, level: MUST, tests: [P7.7, P9.1], title: "outbound grpc-timeout <= 3 s and below the inbound remainder" }
  - { id: CP-OUT-03, profile: outbound, level: MUST, skippable: true, tests: [P7.8], title: "only idempotent methods are retried on UNAVAILABLE" }
  - { id: CP-OUT-04, profile: outbound, level: MUST, skippable: true, tests: [P7.8], title: "while always UNAVAILABLE, retry traffic stays within the retryThrottling budget (<= 10 % in steady state)" }
  - { id: CP-OUT-05, profile: outbound, level: MUST, tests: [P7.9], title: "peer hung, more than 64 concurrent: OUTBOUND_LIMIT at once" }
  - { id: CP-OUT-06, profile: outbound, level: MUST, skippable: true, tests: [P8.1, P8.2], title: "user-plane HTTP forwards Authorization, X-Request-Id, traceparent" }
  - { id: CP-OUT-07, profile: outbound, level: MUST, tests: [P3.4, P9.1], title: "peer hung: the component answers 504 within the route deadline" }
  - { id: CP-OUT-08, profile: outbound, level: MUST, tests: [P7.2], title: "outbound calls carry be-caller, be-actor-sub, traceparent" }
  # events-pub
  - { id: CP-EVP-01, profile: events-pub, level: MUST, tests: [P12.1, P12.3], title: "a command puts an event on the stream with the full ce-* set; ce-id is UUIDv7 = Nats-Msg-Id; trace matches the request" }
  - { id: CP-EVP-02, profile: events-pub, level: MUST, tests: [P12.1], title: "bus stopped, command succeeds, bus back: delivered exactly once" }
  - { id: CP-EVP-03, profile: events-pub, level: MUST, tests: [P12.1, P10.9], title: "two replicas: each outbox row published once" }
  - { id: CP-EVP-04, profile: events-pub, level: MUST, tests: [P12.1, P12.4], title: "a missing stream is created with defaults; an existing one is not changed" }
  - { id: CP-EVP-05, profile: events-pub, level: MUST, tests: [P12.2], title: "payloads pass the contract; a payload above 64 KiB is refused at publish" }
  - { id: CP-EVP-06, profile: events-pub, level: MUST, tests: [P12.16], title: "events.publishes equals the event contract's subjects, and every subject published during the run is in it" }
  # events-sub
  - { id: CP-EVS-01, profile: events-sub, level: MUST, tests: [P12.5, P12.9], title: "durable name and parameters; events published while offline are received" }
  - { id: CP-EVS-02, profile: events-sub, level: MUST, tests: [P12.6, P15.2], title: "a duplicate delivery takes effect once" }
  - { id: CP-EVS-03, profile: events-sub, level: MUST, tests: [P12.6, P15.1], title: "out of order (v3 before v2) ends in the in-order state (property test)" }
  - { id: CP-EVS-04, profile: events-sub, level: MUST, tests: [P12.7, P12.14], title: "a malformed payload or missing ce-id goes to the DLQ with be-dlq-* headers" }
  - { id: CP-EVS-05, profile: events-sub, level: MUST, tests: [P12.7], title: "a temporary failure naks, redelivers and succeeds after recovery" }
  - { id: CP-EVS-06, profile: events-sub, level: MUST, tests: [P12.8], title: "events from a handler carry causationid and hopcount+1; hopcount 11 inbound goes to the DLQ" }
  - { id: CP-EVS-07, profile: events-sub, level: MUST, skippable: true, tests: [P11.8], title: "a transaction-document event without legal entity goes to the DLQ" }
  - { id: CP-EVS-08, profile: events-sub, level: MUST, tests: [P12.5, P12.7], title: "with EVENTS_MAX_DELIVER=2 a failing message is dead-lettered once (message ID dlq:<durable>:<seq>) and terminated; the durable has max_deliver -1, no backoff, ack_wait 30s; an existing durable is not changed at start" }
  - { id: CP-EVS-09, profile: events-sub, level: MUST, tests: [P12.16, P12.5], title: "the durables the component creates are exactly those of events.subscribes" }
  # idempotency
  - { id: CP-IDEM-01, profile: idempotency, level: MUST, tests: [P13.1, P13.3], title: "a replay returns the first result" }
  - { id: CP-IDEM-02, profile: idempotency, level: MUST, tests: [P13.2, P13.5], title: "another body answers 400 IDEMPOTENCY_MISMATCH" }
  - { id: CP-IDEM-03, profile: idempotency, level: MUST, tests: [P13.2], title: "another target answers IDEMPOTENCY_MISMATCH" }
  - { id: CP-IDEM-04, profile: idempotency, level: MUST, tests: [P13.2], title: "another command answers IDEMPOTENCY_MISMATCH" }
  - { id: CP-IDEM-05, profile: idempotency, level: MUST, skippable: true, tests: [P13.3], title: "a two-step command in progress answers 409 IDEMPOTENCY_IN_PROGRESS" }
  - { id: CP-IDEM-06, profile: idempotency, level: MUST, tests: [P13.1, P13.4], title: "different callers with one key are independent" }
  - { id: CP-IDEM-07, profile: idempotency, level: MUST, tests: [P13.6, P10.9], title: "concurrent same-key requests execute once" }
  - { id: CP-IDEM-08, profile: idempotency, level: MUST, tests: [P3.7], title: "header and body key are equivalent; a conflict answers 400" }
  # db
  - { id: CP-DB-01, profile: db, level: MUST, tests: [P10.1, P10.2, P10.7, P11.2, P11.5], title: "every profile passes under a random identity (separate owner and runtime roles); every table owned by PG_OWNER_USER; nothing outside the schema" }
  - { id: CP-DB-02, profile: db, level: MUST, tests: [P10.3, P10.4, P3.4], title: "the suite holds a lock: the component answers 409 LOCK_TIMEOUT within lock_timeout" }
  - { id: CP-DB-03, profile: db, level: MUST, tests: [P10.5], title: "under full load the connections with application_name = the component ID stay <= PG_POOL_MAX; an idle component keeps a session named <ID>@<version>" }
  - { id: CP-DB-04, profile: db, level: MUST, tests: [P11.3], title: "besdk_* tables match the reference DDL column for column; the authz projection tables exist exactly when resources are declared" }
  - { id: CP-DB-05, profile: db, level: MUST, tests: [P10.12, P10.1], title: "while the service runs (migrations done) no session is logged in as PG_OWNER_USER, and partition upkeep still works" }
  - { id: CP-DB-06, profile: db, level: MUST, tests: [P2.9, P10.5], title: "PG_USER's password changed and its file replaced while running: within 30 s new connections use it, with no restart and no failed request" }
  # jobs
  - { id: CP-JOBS-01, profile: jobs, level: MUST, tests: [P14.2, P14.5, P14.6], title: "two replicas: the platform cron be.cleanup, set to @every 2s through JOBS_OVERRIDES, runs each slot once" }
  - { id: CP-JOBS-02, profile: jobs, level: MUST, tests: [P14.2, P10.8], title: "a singleton has one holder; another takes over within the TTL when it dies" }
  - { id: CP-JOBS-03, profile: jobs, level: MUST, skippable: true, tests: [P14.2], title: "a queued job runs once across two replicas" }
  - { id: CP-JOBS-04, profile: jobs, level: MUST, skippable: true, tests: [P14.2], title: "a rolled-back business transaction leaves no job" }
  - { id: CP-JOBS-05, profile: jobs, level: MUST, tests: [P1.7, P14.2], title: "pg_terminate_backend during a run: the job restarts, the process stays up" }
  - { id: CP-JOBS-06, profile: jobs, level: MUST, tests: [P14.8, P1.1], title: "only when /_be/info lists job_run: two concurrent job run of one cron job run the slot once and both exit 0, with the in-process copy disabled; an unknown job name exits 64" }
  # lifecycle
  - { id: CP-LIFE-01, profile: lifecycle, level: MUST, tests: [P16.6, P11.3, P16.10], title: "a freshly migrated database accepts a write at once" }
  - { id: CP-LIFE-02, profile: lifecycle, level: MUST, tests: [P16.3], title: "a range before the online bound answers RANGE_COLD" }
  - { id: CP-LIFE-03, profile: lifecycle, level: MUST, tests: [P16.4, P16.8], title: "every _lifecycle endpoint is mounted; unimplemented ones answer 501" }
  - { id: CP-LIFE-04, profile: lifecycle, level: MUST, tests: [P16.1, P11.11, P15.5], title: "lifecycle.yaml passes the schema and covers every table" }
  # blob
  - { id: CP-BLOB-01, profile: blob, level: MUST, tests: [P17.2], title: "a presigned PUT carries a content-length limit" }
  - { id: CP-BLOB-02, profile: blob, level: MUST, tests: [P17.1, P17.2], title: "the bucket is not anonymously readable" }
  - { id: CP-BLOB-03, profile: blob, level: MUST, tests: [P17.2], title: "presigned URLs expire within 5 minutes" }
  # shell
  - { id: CP-SHELL-01, profile: shell, level: MUST, tests: [P19.1, P1.8], title: "a member not compiled in: exit 2 naming it" }
  - { id: CP-SHELL-02, profile: shell, level: MUST, tests: [P19.1, P1.8], title: "a member at another version: exit 2" }
  - { id: CP-SHELL-03, profile: shell, level: MUST, tests: [P19.3], title: "a member's PG_HOST or AUTHZ_URL differs from the shell's: exit 78" }
  - { id: CP-SHELL-04, profile: shell, level: MUST, tests: [P19.4, P19.7, P18.1, P18.3], title: "each member's spans carry its own service.name; aggregated /metrics carries component labels" }
  - { id: CP-SHELL-05, profile: shell, level: MUST, tests: [P19.4, P10.5], title: "one member exhausting its pool budget leaves another working; two members on one subject each get a copy" }
  - { id: CP-SHELL-06, profile: shell, level: MUST, tests: [P19.6, P1.7], title: "a member's failed background work is restarted" }
  - { id: CP-SHELL-07, profile: shell, level: MUST, tests: [P19.5, P10.2], title: "under a NOINHERIT login role every background path works" }
  - { id: CP-SHELL-08, profile: shell, level: MUST, tests: [P19.2], title: "each member's own profiles pass again in shell mode" }
  - { id: CP-SHELL-09, profile: shell, level: MUST, tests: [P18.1, P19.4], title: "after an HTTP -> gRPC -> event chain no span carries service.name = the shell's ID" }
  - { id: CP-SHELL-10, profile: shell, level: MUST, tests: [P18.1, P19.3], title: "stopping one member does not drop spans another member emits afterwards" }
  - { id: CP-SHELL-11, profile: shell, level: MUST, tests: [P19.9, P19.10], title: "the shell's /readyz is 503 naming the members not ready, then 200; its stopGracePeriodSeconds and SHUTDOWN_GRACE are at least every member's" }
