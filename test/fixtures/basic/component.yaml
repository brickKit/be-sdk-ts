apiVersion: brickkit/v1
kind: Component
metadata:
  id: sdktest/basic
  version: 3.0.0
dependencies:
  components:
    - sdktest/peer@1.0.0
    - id: mdm/org@3.0.0
      optional: true
configSchema:
  type: object
  properties:
    PG_HOST: {type: string}
    PG_PORT: {type: integer, default: 5432}
    PG_DATABASE: {type: string}
    PG_USER: {type: string}
    PG_PASSWORD_FILE: {type: string, secret: true, mount: file}
    PG_SCHEMA: {type: string}
    PG_MIGRATION_HOST: {type: string}
    EVENT_BUS_URL: {type: string}
    NATS_URL: {type: string}
    EVENTS_BACKOFF: {type: string, default: "1s,10s,1m,5m,15m,30m,1h"}
    AUTHZ_URL: {type: string}
    IAM_URL: {type: string}
    LOG_LEVEL: {type: string, default: info}
    HTTP_DEFAULT_TIMEOUT: {type: string, default: 10s}
    BASIC_LIMIT: {type: integer, default: 7}
    BASIC_FLAG: {type: boolean, default: false}
    BASIC_MODE: {type: string, enum: [a, b], default: a}
  required: [PG_HOST, PG_DATABASE, PG_USER, PG_PASSWORD_FILE, PG_SCHEMA, AUTHZ_URL, IAM_URL]
deployment:
  port: 8080
  protocol: http
  extraPorts:
    - {name: grpc, port: 9090, protocol: grpc}
  stopGracePeriodSeconds: 30
events:
  publishes: [sdktest.basic.thing.created.v1]
  subscribes: [sdktest.peer.owner.updated.v1]
